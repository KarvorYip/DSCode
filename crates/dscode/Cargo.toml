[package]
name = "dscode"
version = "0.1.2"
edition = "2021"
description = "DSCode — event-sourced terminal coding agent"
repository = "https://github.com/KarvorYip/DSCode"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "native-tls"] }
tokio = { version = "1", features = ["full"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"
async-trait = "0.1"
serde_yaml = "0.9"
regex = "1"
fancy-regex = "0.13"
ignore = "0.4"
globset = "0.4"
sha1 = "0.10"
dirs = "5"
parking_lot = "0.12"
rmcp = { version = "=3.1.2", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest-native-tls", "auth"] }
http = "1"

[dev-dependencies]
# ponytail: pin 3.14——3.15+ 依赖 getrandom 0.3/0.4，其 bcryptprimitives raw-dylib
# 在本机 windows-gnu 工具链（dlltool 缺 as）无法链接；3.14 走 windows-sys 系统库
tempfile = "=3.14.0"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dscode-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/dscode-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/dscode-{ target }.zip"
pkg-fmt = "zip"
